<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mapa — Tatry Hills</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha384-sHL9NAb7lN7rfvG5lfHpm643Xkcjzp4jFvuavGOndn6pjVqS6ny56CAt3nsEVT4H" crossorigin="anonymous">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha384-cxOPjt7s7Iz04uaHJceBmS+qpjv2JkIHNVcuOrM+YHwZOmJGBXI00mdUXEq65HTH" crossorigin="anonymous"></script>
<style>
  html,body{margin:0;height:100%;background:#14100D}
  #map{height:100%;width:100%;background:#14100D}
  .leaflet-tile{filter:grayscale(1) invert(1) brightness(.9) sepia(.32) hue-rotate(-8deg) contrast(.92) brightness(.82)}
  .leaflet-container{font-family:'Jost',system-ui,sans-serif}
  .leaflet-control-attribution{background:rgba(20,16,13,.75)!important;color:#8B8072!important;font-size:10px}
  .leaflet-control-attribution a{color:#C6A87C!important}
  .leaflet-control-zoom a{background:#191410!important;color:#C6A87C!important;border:1px solid #3A322A!important;border-radius:0!important}
  .leaflet-control-zoom a:hover{background:#241E19!important}
  .th-pin{position:relative}
  .th-pin .dot{width:16px;height:16px;border-radius:50%;background:#C6A87C;border:2px solid #14100D;box-shadow:0 0 0 6px rgba(198,168,124,.25);animation:ring 2.6s ease-out infinite}
  @keyframes ring{0%{box-shadow:0 0 0 0 rgba(198,168,124,.45)}100%{box-shadow:0 0 0 18px rgba(198,168,124,0)}}
  .th-pin .lbl{position:absolute;left:50%;transform:translateX(-50%);top:-38px;white-space:nowrap;background:#14100D;border:1px solid #C6A87C;color:#EFE7DC;padding:6px 12px;font-size:11px;letter-spacing:.22em;text-transform:uppercase}
  .th-min{width:9px;height:9px;border-radius:50%;background:#EFE7DC;border:2px solid #14100D;opacity:.85}
  .th-min-lbl{position:absolute;left:50%;transform:translateX(-50%);top:12px;white-space:nowrap;color:#EFE7DC;font-size:11px;letter-spacing:.14em;text-transform:uppercase;text-shadow:0 1px 6px #14100D,0 0 12px #14100D}
  .th-dist{background:rgba(20,16,13,.85)!important;border:1px solid #C6A87C!important;border-radius:0!important;color:#EFE7DC!important;font-size:11px;letter-spacing:.16em;text-transform:uppercase;padding:4px 10px;box-shadow:none!important}
  .th-dist::before{display:none}
</style>
</head>
<body>
<div id="map"></div>
<script>
  var tatry = [49.3068, 19.9312];      // działka inwestycji, przy Gubałówce
  var krupowki = [49.2942, 19.9496];   // Krupówki
  var gubalowka = [49.3117, 19.9337];  // wyciąg na Gubałówce

  var map = L.map('map', { scrollWheelZoom: false, zoomControl: true }).setView(tatry, 15);
  L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', { attribution: '© OpenStreetMap contributors', maxZoom: 19 }).addTo(map);

  L.marker(tatry, { icon: L.divIcon({ className: 'th-pin', html: '<div class="lbl">Tatry Hills</div><div class="dot"></div>', iconSize: [16, 16], iconAnchor: [8, 8] }) }).addTo(map);
  L.marker(gubalowka, { icon: L.divIcon({ className: 'th-pin', html: '<div class="th-min"></div><div class="th-min-lbl">Wyciąg Gubałówka</div>', iconSize: [9, 9], iconAnchor: [4, 4] }) }).addTo(map);

  L.polyline([tatry, gubalowka], { color: '#C6A87C', weight: 1.6, dashArray: '5 7', opacity: .8 }).addTo(map)
    .bindTooltip('≈ 600 m', { permanent: true, direction: 'center', className: 'th-dist' }).openTooltip();

  function distM(a, b) { return L.latLng(a).distanceTo(L.latLng(b)); }
  function fmtDist(m) { return m; }

  function frame() {
    map.invalidateSize(false);
    var b = L.latLngBounds([tatry, gubalowka]).pad(0.45);
    map.fitBounds(b, { maxZoom: 16, animate: false });
    if (map.getZoom() < 13) map.setView(tatry, 15, { animate: false });
  }
  frame();
  setTimeout(frame, 300);
  setTimeout(frame, 1200);
  window.addEventListener('load', frame);
  window.addEventListener('resize', frame);
  if (window.ResizeObserver) new ResizeObserver(frame).observe(document.getElementById('map'));
  map.on('click', function(){ map.scrollWheelZoom.enable(); });
</script>
</body>
</html>
